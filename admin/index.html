<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Di'Mogalo Constructora & Propiedades</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #070e1a; --bg2: #0d1b2a; --bg3: #111e30; --bg4: #16263b;
      --border: rgba(255,255,255,0.08); --border-hover: rgba(212,175,55,0.4);
      --gold: #d4af37; --gold-light: #fde047; --gold-glow: rgba(212,175,55,0.15);
      --green: #34d399; --red: #f87171; --blue: #38bdf8;
      --text: #e2e8f0; --text2: #94a3b8; --muted: #475569;
      --sidebar-w: 270px; --radius: 12px; --transition: 0.2s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: fixed;
      top: 0; left: 0; height: 100vh; z-index: 200; transition: transform 0.3s ease;
    }
    .sidebar-logo {
      padding: 22px 20px; border-bottom: 1px solid var(--border);
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--gold);
      display: flex; align-items: center; gap: 10px;
    }
    .logo-sub { font-size: 0.65rem; display: block; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 400; margin-top: 2px; }
    .nav-section-label { padding: 14px 20px 6px; font-size: 0.65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .nav-menu { flex: 1; overflow-y: auto; padding: 8px 0; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 20px;
      color: var(--text2); font-size: 0.84rem; cursor: pointer; transition: all var(--transition);
      border-left: 3px solid transparent; margin: 1px 0;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-item.active { color: var(--gold); border-left-color: var(--gold); background: var(--gold-glow); font-weight: 600; }
    .nav-item i { width: 20px; text-align: center; font-size: 0.95rem; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); }
    .gh-status { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.local { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
    .status-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }

    /* Hamburger & Mobile Overlay */
    .hamburger {
      display: none; position: fixed; top: 14px; left: 14px; z-index: 300;
      background: var(--bg2); border: 1px solid var(--border); color: var(--text);
      padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 1rem;
    }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; }

    /* Main Container */
    .main-content { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
    }
    .topbar-title { font-weight: 600; font-size: 0.98rem; display: flex; align-items: center; gap: 8px; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; transition: all var(--transition); display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #000; font-weight: 700; font-size: 0.85rem; padding: 9px 20px; border-radius: 10px; box-shadow: 0 2px 10px rgba(212,175,55,0.2); }
    .btn-gold:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 4px 18px rgba(212,175,55,0.4); }
    .btn-gold:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--border-hover); background: rgba(255,255,255,0.04); }
    .btn-danger { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
    .btn-danger:hover { background: rgba(248,113,113,0.25); }
    .btn-success { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }
    .btn-success:hover { background: rgba(52,211,153,0.25); }

    /* Login Screen */
    .login-wrap { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(ellipse at 50% 30%, rgba(212,175,55,0.08) 0%, transparent 70%); }
    .login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 44px 36px; width: 100%; max-width: 440px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
    .login-logo { text-align: center; margin-bottom: 6px; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.6rem; color: var(--gold); }
    .login-sub { text-align: center; font-size: 0.85rem; color: var(--text2); margin-bottom: 28px; }
    .input-group { position: relative; margin-bottom: 16px; }
    .input-group i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .input-group input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 12px 14px 12px 40px; border-radius: 10px; font-family: 'Inter', sans-serif; transition: border-color var(--transition); }
    .input-group input:focus { outline: none; border-color: var(--gold); }
    .login-hint { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }
    .login-hint a { color: var(--gold); text-decoration: none; }
    .btn-primary { width: 100%; background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #000; border: none; padding: 13px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.95rem; font-family: 'Inter', sans-serif; transition: all var(--transition); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.35); }
    .divider { display: flex; align-items: center; margin: 20px 0; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider span { padding: 0 10px; }

    /* Editor Layout */
    .editor-wrap { padding: 28px; flex: 1; max-width: 1300px; margin: 0 auto; width: 100%; }
    .section-panel { display: none; animation: fadeIn 0.25s ease; }
    .section-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-family: 'Outfit', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--text); }
    .page-subtitle { font-size: 0.82rem; color: var(--text2); margin-top: 4px; }
    
    .fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    .field-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; transition: border-color var(--transition); }
    .field-box:hover { border-color: var(--border-hover); }
    .field-box.full-width { grid-column: 1 / -1; }
    .field-label { font-size: 0.72rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }
    .field-input, .field-textarea, .field-select { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.875rem; transition: border-color var(--transition); }
    .field-input:focus, .field-textarea:focus, .field-select:focus { outline: none; border-color: var(--gold); }
    .field-textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
    .field-hint { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }

    /* Card List Items (Rooms, Gallery, Services, Tips, Reviews) */
    .items-container { display: flex; flex-direction: column; gap: 20px; }
    .card-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px; position: relative; transition: border-color var(--transition); }
    .card-item:hover { border-color: var(--border-hover); }
    .card-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .card-item-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .card-item-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

    /* Feature Pills */
    .features-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .feature-pill { background: var(--bg3); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; display: flex; align-items: center; gap: 6px; }
    .feature-pill input { background: transparent; border: none; color: var(--text); font-size: 0.78rem; outline: none; width: 140px; }
    .feature-pill i { cursor: pointer; color: var(--muted); transition: color 0.2s; }
    .feature-pill i:hover { color: var(--red); }

    /* Image Selector & Upload */
    .img-upload-box { border: 2px dashed var(--border); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; position: relative; overflow: hidden; transition: border-color var(--transition); background: var(--bg3); }
    .img-upload-box:hover { border-color: var(--gold); }
    .img-upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 5; }
    .img-preview { width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .img-upload-hint { font-size: 0.75rem; color: var(--text2); }
    .img-upload-icon { font-size: 1.6rem; margin-bottom: 6px; color: var(--gold); }

    /* Alerts */
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .alert-success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--green); }
    .alert-error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
    .alert-info { background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.25); color: var(--gold); }

    /* Media Grid */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .media-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-align: center; padding: 8px; position: relative; }
    .media-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
    .media-card-name { font-size: 0.72rem; color: var(--text2); margin-top: 6px; word-break: break-all; }

    /* Spinner */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Icon Picker Mini Modal */
    .icon-picker-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .icon-chip { padding: 4px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; font-size: 0.75rem; cursor: pointer; color: var(--text2); }
    .icon-chip:hover, .icon-chip.active { border-color: var(--gold); color: var(--gold); }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main-content { margin-left: 0; }
      .topbar { padding: 14px 18px 14px 60px; }
      .editor-wrap { padding: 20px 14px; }
      .fields-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="app" style="width:100%;">

  <!-- LOGIN / ACCESO -->
  <div class="login-wrap" v-if="!isLoggedIn">
    <div class="login-box">
      <div class="login-logo"><i class="fa-solid fa-building"></i> Di'Mogalo</div>
      <div class="login-sub">Panel de Administración de Contenidos</div>

      <div class="input-group">
        <i class="fa-solid fa-key"></i>
        <input type="password" v-model="token" placeholder="Token de GitHub (opcional: ghp_...)" @keydown.enter="loginGitHub">
      </div>
      
      <button class="btn-primary" @click="loginGitHub" :disabled="loading">
        <span v-if="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Conectando...</span>
        <span v-else><i class="fa-solid fa-cloud-arrow-down"></i> Entrar y Conectar GitHub</span>
      </button>

      <div class="divider">
        <span>O Modo Directo</span>
      </div>

      <button class="btn btn-ghost" style="width:100%; justify-content:center; padding:12px; font-weight:600;" @click="loginLocal">
        <i class="fa-solid fa-laptop-code"></i> Editar sin Token (Modo Local / Descarga)
      </button>

      <div class="alert alert-error" v-if="error" style="margin-top:16px;">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
      </div>

      <p class="login-hint">
        Con el <strong>Token de GitHub</strong> los cambios se guardan directamente en el sitio web.<br>
        En <strong>Modo Local</strong> puedes editar y guardar copias en tu equipo.
      </p>
    </div>
  </div>

  <!-- ADMIN PANEL MAIN -->
  <template v-else>
    <button class="hamburger" @click="sidebarOpen = !sidebarOpen">
      <i :class="sidebarOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"></i>
    </button>
    <div class="sidebar-overlay" :class="{ open: sidebarOpen }" @click="sidebarOpen = false"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <div class="sidebar-logo">
        <i class="fa-solid fa-building"></i> Di'Mogalo
        <span class="logo-sub">Construcciones &amp; Propiedades</span>
      </div>
      
      <nav class="nav-menu">
        <div class="nav-section-label">Secciones del Sitio</div>
        
        <div v-for="sec in sections" :key="sec.id"
          class="nav-item" :class="{ active: activeSection === sec.id }"
          @click="activeSection = sec.id; sidebarOpen = false">
          <i :class="sec.icon"></i> {{ sec.label }}
        </div>

        <div class="nav-section-label">Archivos &amp; Ajustes</div>
        
        <div class="nav-item" :class="{ active: activeSection === 'contact' }"
          @click="activeSection = 'contact'; sidebarOpen = false">
          <i class="fa-solid fa-address-card"></i> Contacto &amp; Redes
        </div>
        
        <div class="nav-item" :class="{ active: activeSection === 'media' }"
          @click="activeSection = 'media'; sidebarOpen = false">
          <i class="fa-solid fa-images"></i> Gestor de Imágenes
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="gh-status">
          <div class="status-dot" :class="statusDot"></div>
          <span>{{ statusText }}</span>
        </div>
        <div style="font-size:0.7rem; color:var(--muted);">Repositorio: lomejordechile/di-mogalo-valparaiso</div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <!-- TOPBAR -->
      <div class="topbar">
        <div class="topbar-title">
          <i :class="currentSectionIcon" style="color:var(--gold);"></i>
          {{ currentSectionLabel }}
        </div>
        
        <div class="topbar-actions">
          <a :href="siteUrl" target="_blank" class="btn btn-ghost">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Ver Sitio Web
          </a>
          <button class="btn btn-ghost" @click="downloadJSON" title="Guardar copia local">
            <i class="fa-solid fa-download"></i> Descargar JSON
          </button>
          <button class="btn btn-ghost" @click="logout">
            <i class="fa-solid fa-right-from-bracket"></i> Salir
          </button>
          <button class="btn btn-gold" @click="saveChanges" :disabled="saving">
            <span class="spinner" v-if="saving"></span>
            <i class="fa-solid fa-cloud-arrow-up" v-else></i>
            {{ saving ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
        </div>
      </div>

      <!-- EDITOR BODY -->
      <div class="editor-wrap">
        <div class="alert alert-success" v-if="successMsg">
          <i class="fa-solid fa-circle-check"></i> {{ successMsg }}
        </div>
        <div class="alert alert-error" v-if="error">
          <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
        <div class="alert alert-info" v-if="pendingImages.length > 0">
          <i class="fa-solid fa-clock"></i> Hay {{ pendingImages.length }} imagen(es) nueva(s) en espera &mdash; se subirán al presionar "Guardar Cambios".
        </div>

        <div v-if="loading" style="text-align:center; padding:60px; color:var(--text2);">
          <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; color:var(--gold);"></i>
          <p style="margin-top:12px;">Cargando información del sitio...</p>
        </div>

        <template v-else-if="content">

          <!-- 1. HERO & GENERAL -->
          <div class="section-panel" :class="{ active: activeSection === 'hero' }">
            <div class="page-header">
              <div>
                <div class="page-title">Hero &amp; Identidad General</div>
                <div class="page-subtitle">Configura el título principal de bienvenida, subtítulo y logos del sitio web.</div>
              </div>
            </div>
            
            <div class="fields-grid">
              <div class="field-box full-width">
                <div class="field-label">Nombre Comercial / Marca</div>
                <input class="field-input" v-model="content.hostal_name" placeholder="Di'Mogalo Constructora &amp; Propiedades">
              </div>

              <div class="field-box full-width" v-if="content.hero">
                <div class="field-label">Título Principal (Hero)</div>
                <input class="field-input" v-model="content.hero.title" placeholder="Tu balcón privado sobre la magia de Valparaíso">
              </div>

              <div class="field-box full-width" v-if="content.hero">
                <div class="field-label">Subtítulo (Hero)</div>
                <textarea class="field-textarea" v-model="content.hero.subtitle" placeholder="Vive una experiencia única..."></textarea>
              </div>

              <div class="field-box" v-if="content.hero">
                <div class="field-label">Imagen de Fondo (Hero)</div>
                <div class="img-upload-box">
                  <input type="file" accept="image/*" @change="e => uploadSingleImage(e, name => content.hero.background = name)">
                  <img :src="getImageUrl(content.hero.background)" class="img-preview" v-if="content.hero.background">
                  <div class="img-upload-icon"><i class="fa-solid fa-image"></i></div>
                  <div class="img-upload-hint">Clic para cambiar imagen de fondo</div>
                </div>
                <div class="field-hint">Archivo: {{ content.hero.background }}</div>
              </div>

              <div class="field-box">
                <div class="field-label">Logo Navbar Superior</div>
                <div class="img-upload-box">
                  <input type="file" accept="image/*" @change="e => uploadSingleImage(e, name => content.logo = name)">
                  <img :src="getImageUrl(content.logo)" class="img-preview" v-if="content.logo">
                  <div class="img-upload-icon"><i class="fa-solid fa-crown"></i></div>
                  <div class="img-upload-hint">Clic para cambiar logo</div>
                </div>
                <div class="field-hint">Archivo: {{ content.logo }}</div>
              </div>
            </div>
          </div>

          <!-- 2. HABITACIONES Y PROPIEDADES (CRUD) -->
          <div class="section-panel" :class="{ active: activeSection === 'rooms' }">
            <div class="page-header">
              <div>
                <div class="page-title">Habitaciones y Propiedades en Arriendo</div>
                <div class="page-subtitle">Administra todas las opciones de hospedaje y arriendo mostradas a tus clientes.</div>
              </div>
              <button class="btn btn-gold" @click="addRoom">
                <i class="fa-solid fa-plus"></i> Agregar Nueva Habitación
              </button>
            </div>

            <div class="field-box full-width" style="margin-bottom:20px;">
              <div class="field-label">Título General de la Sección</div>
              <input class="field-input" v-model="content.rooms_title_text" placeholder="Nuestras Habitaciones y Tarifas">
            </div>

            <div class="items-container">
              <div class="card-item" v-for="(room, idx) in content.rooms" :key="idx">
                <div class="card-item-header">
                  <div class="card-item-title">
                    <i class="fa-solid fa-bed" style="color:var(--gold);"></i>
                    {{ room.title || 'Nueva Habitación' }}
                  </div>
                  <button class="btn btn-danger" @click="removeRoom(idx)">
                    <i class="fa-solid fa-trash"></i> Eliminar
                  </button>
                </div>

                <div class="card-item-body">
                  <div>
                    <div class="field-label">Título / Nombre de la Habitación</div>
                    <input class="field-input" v-model="room.title" placeholder="Ej: Habitación Diaria Pareja">
                  </div>

                  <div>
                    <div class="field-label">Imagen de la Habitación</div>
                    <div class="img-upload-box">
                      <input type="file" accept="image/*" @change="e => uploadSingleImage(e, name => room.image = name)">
                      <img :src="getImageUrl(room.image)" class="img-preview" v-if="room.image">

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp, ref, computed } = Vue;

createApp({
  setup() {
    const token        = ref('');
    const isLoggedIn   = ref(false);
    const isLocalMode  = ref(false);
    const loading      = ref(false);
    const saving       = ref(false);
    const error        = ref('');
    const successMsg   = ref('');
    const content      = ref(null);
    const fileSha      = ref('');
    const activeSection = ref('hero');
    const pendingImages = ref([]);
    const sidebarOpen   = ref(false);
    const ghConnected   = ref(null);

    const siteUrl   = 'https://lomejordechile.github.io/di-mogalo-valparaiso/';
    const REPO      = 'lomejordechile/di-mogalo-valparaiso';
    const DATA_PATH = 'data/content.json';
    const BRANCH    = 'main';

    const sections = [
      { id:'hero',       label:'Hero & Identidad',      icon:'fa-solid fa-house' },
      { id:'rooms',      label:'Habitaciones & Arriendos', icon:'fa-solid fa-bed' },
      { id:'gallery',    label:'Galería de Fotos',      icon:'fa-solid fa-image' },
      { id:'experience', label:'Experiencia',           icon:'fa-solid fa-star' },
      { id:'services',   label:'Servicios & Amenidades', icon:'fa-solid fa-concierge-bell' },
      { id:'tips',       label:'Reglas & Normas',        icon:'fa-solid fa-clipboard-list' },
      { id:'reviews',    label:'Reseñas de Huéspedes',   icon:'fa-solid fa-comments' },
    ];

    const statusDot = computed(() => {
      if (ghConnected.value === true) return 'connected';
      if (isLocalMode.value) return 'local';
      return 'error';
    });

    const statusText = computed(() => {
      if (ghConnected.value === true) return 'Conectado a GitHub API';
      if (isLocalMode.value) return 'Modo Local (Sin GitHub)';
      return 'No Autenticado';
    });

    const currentSectionLabel = computed(() => {
      if (activeSection.value === 'contact') return 'Contacto & Redes Sociales';
      if (activeSection.value === 'media')   return 'Gestor de Archivos de Imágenes';
      return sections.find(s => s.id === activeSection.value)?.label || '';
    });

    const currentSectionIcon = computed(() => {
      if (activeSection.value === 'contact') return 'fa-solid fa-address-card';
      if (activeSection.value === 'media')   return 'fa-solid fa-images';
      return sections.find(s => s.id === activeSection.value)?.icon || 'fa-solid fa-circle';
    });

    const mediaList = computed(() => {
      const set = new Set();
      if (!content.value) return [];
      if (content.value.logo) set.add(content.value.logo);
      if (content.value.hero && content.value.hero.background) set.add(content.value.hero.background);
      if (content.value.rooms) {
        content.value.rooms.forEach(r => { if (r.image) set.add(r.image); });
      }
      if (content.value.gallery) {
        content.value.gallery.forEach(g => { if (g.image) set.add(g.image); });
      }
      pendingImages.value.forEach(pi => set.add(pi.filename));
      return Array.from(set);
    });

    const ghHeaders = () => ({
      'Authorization': `token ${token.value}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    });

    const fetchContent = async () => {
      if (isLocalMode.value) {
        const localSaved = localStorage.getItem('dimogalo_content_json');
        if (localSaved) return JSON.parse(localSaved);
        const res = await fetch('../data/content.json');
        return await res.json();
      }

      const res = await fetch(
        `https://api.github.com/repos/${REPO}/contents/${DATA_PATH}?ref=${BRANCH}&t=${Date.now()}`,
        { headers: ghHeaders() }
      );
      if (!res.ok) throw new Error(res.status === 401 ? 'Token inválido o sin permisos repo.' : 'Error conectando a GitHub.');
      const d = await res.json();
      fileSha.value = d.sha;
      return JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));
    };

    const loginGitHub = async () => {
      if (!token.value.trim()) { error.value = 'Por favor ingresa un token de GitHub.'; return; }
      loading.value = true; error.value = ''; isLocalMode.value = false;
      try {
        content.value = await fetchContent();
        isLoggedIn.value = true;
        ghConnected.value = true;
        sessionStorage.setItem('gh_token_di_mogalo', token.value);
      } catch(e) { error.value = e.message; ghConnected.value = false; }
      loading.value = false;
    };

    const loginLocal = async () => {
      loading.value = true; error.value = ''; isLocalMode.value = true;
      try {
        content.value = await fetchContent();
        isLoggedIn.value = true;
        ghConnected.value = false;
      } catch(e) { error.value = 'No se pudo cargar el archivo local content.json'; }
      loading.value = false;
    };

    const logout = () => {
      sessionStorage.removeItem('gh_token_di_mogalo');
      isLoggedIn.value = false; content.value = null; ghConnected.value = null; isLocalMode.value = false;
    };

    const getImageUrl = (path) => {
      if (!path) return '';
      const foundPending = pendingImages.value.find(p => p.filename === path);
      if (foundPending) return `data:image/png;base64,${foundPending.base64}`;
      if (path.startsWith('data:') || path.startsWith('http')) return path;
      return `../${path}`;
    };

    const uploadSingleImage = (e, callback) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const base64 = evt.target.result.split(',')[1];
        const ext = file.name.split('.').pop().toLowerCase();
        const newFilename = `img_${Date.now()}_${Math.floor(Math.random()*1000)}.${ext}`;
        pendingImages.value.push({ filename: newFilename, base64 });
        callback(newFilename);
      };
      reader.readAsDataURL(file);
    };

    const handleMultipleUploads = (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const base64 = evt.target.result.split(',')[1];
          const ext = file.name.split('.').pop().toLowerCase();
          const newFilename = `upload_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9]/g,'_')}.${ext}`;
          pendingImages.value.push({ filename: newFilename, base64 });
        };
        reader.readAsDataURL(file);
      });
    };

    /* CRUD ROOMS */
    const addRoom = () => {
      if (!content.value.rooms) content.value.rooms = [];
      content.value.rooms.unshift({
        title: 'Nueva Habitación',
        description: 'Descripción de la habitación...',
        image: 'VISTA.jpg',
        features: ['🛌 Cama cómoda', '📺 Smart TV', '📶 Wi-Fi']
      });
    };
    const removeRoom = (idx) => content.value.rooms.splice(idx, 1);
    const addFeature = (room) => { if (!room.features) room.features = []; room.features.push('✨ Nueva característica'); };
    const removeFeature = (room, fIdx) => room.features.splice(fIdx, 1);

    /* CRUD GALLERY */
    const addGalleryItem = () => {
      if (!content.value.gallery) content.value.gallery = [];
      content.value.gallery.unshift({ image: 'VISTA.jpg', caption: 'Hermosa vista panorámica del puerto.' });
    };
    const removeGalleryItem = (idx) => content.value.gallery.splice(idx, 1);

    /* CRUD SERVICES, TIPS, REVIEWS, EXP */
    const addService = () => { if (!content.value.services) content.value.services = []; content.value.services.push({ icon: 'wifi', title: 'Nuevo Servicio', text: 'Descripción...' }); };
    const removeService = (idx) => content.value.services.splice(idx, 1);
    const addTip = () => { if (!content.value.tips) content.value.tips = []; content.value.tips.push({ icon: 'key', title: 'Nueva Regla', text: 'Descripción...' }); };
    const removeTip = (idx) => content.value.tips.splice(idx, 1);
    const addReview = () => { if (!content.value.reviews) content.value.reviews = []; content.value.reviews.push({ stars: '★★★★★', text: 'Comentario...', client: 'Cliente' }); };
    const removeReview = (idx) => content.value.reviews.splice(idx, 1);
    const addExpItem = () => { if (!content.value.experience.items) content.value.experience.items = []; content.value.experience.items.push({ icon: 'star', text: 'Nuevo punto' }); };
    const removeExpItem = (idx) => content.value.experience.items.splice(idx, 1);

    /* SAVE & EXPORT */
    const saveChanges = async () => {
      saving.value = true; error.value = ''; successMsg.value = '';
      try {
        const jsonStr = JSON.stringify(content.value, null, 2);
        localStorage.setItem('dimogalo_content_json', jsonStr);

        if (isLocalMode.value || !token.value) {
          successMsg.value = 'Cambios guardados localmente. Usa "Descargar JSON" para actualizar el archivo content.json en tu equipo.';
          saving.value = false;
          return;
        }

        // Subir imágenes pendientes a GitHub
        for (const img of pendingImages.value) {
          const shaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${img.filename}?ref=${BRANCH}`, { headers: ghHeaders() });
          let body = { message: `Upload image: ${img.filename}`, content: img.base64, branch: BRANCH };
          if (shaRes.ok) { const sd = await shaRes.json(); body.sha = sd.sha; }
          const upRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${img.filename}`, {
            method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)
          });
          if (!upRes.ok) throw new Error(`Error subiendo la imagen ${img.filename}`);
        }
        pendingImages.value = [];

        // Guardar JSON en GitHub
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`, {
          method: 'PUT', headers: ghHeaders(),
          body: JSON.stringify({ message: 'Update content.json via Admin Dashboard', content: encoded, sha: fileSha.value, branch: BRANCH })
        });
        if (!res.ok) { const eb = await res.json(); throw new Error(eb.message || 'No se pudo guardar en GitHub.'); }
        const rd = await res.json();
        fileSha.value = rd.content.sha;
        ghConnected.value = true;
        successMsg.value = '¡Guardado con éxito en GitHub! Los cambios estarán visibles en el sitio en 1-2 minutos.';
      } catch(e) {
        error.value = e.message;
      }
      saving.value = false;
    };

    const downloadJSON = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(content.value, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "content.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    const savedToken = sessionStorage.getItem('gh_token_di_mogalo');
    if (savedToken) { token.value = savedToken; loginGitHub(); }

    return {
      token, isLoggedIn, isLocalMode, loading, saving, error, successMsg,
      content, activeSection, sections, pendingImages, sidebarOpen, ghConnected,
      statusDot, statusText, currentSectionLabel, currentSectionIcon, siteUrl, mediaList,
      loginGitHub, loginLocal, logout, uploadSingleImage, handleMultipleUploads, getImageUrl,
      addRoom, removeRoom, addFeature, removeFeature, addGalleryItem, removeGalleryItem,
      addService, removeService, addTip, removeTip, addReview, removeReview, addExpItem, removeExpItem,
      saveChanges, downloadJSON
    };
  }
}).mount('#app');
</script>
